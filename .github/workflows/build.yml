name: Build APK
on:
  push:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Locate project (supports uploading project.zip)
        run: |
          if [ -f project.zip ]; then
            mkdir -p proj && unzip -q -o project.zip -d proj
            echo "DIR=proj" >> "$GITHUB_ENV"
          else
            echo "DIR=." >> "$GITHUB_ENV"
          fi
      - name: Download Plus Jakarta Sans font (optional)
        run: |
          mkdir -p "${{ env.DIR }}/app/src/main/assets/fonts"
          curl -fsSL -o "${{ env.DIR }}/app/src/main/assets/fonts/PlusJakartaSans.ttf" "https://github.com/google/fonts/raw/main/ofl/plusjakartasans/PlusJakartaSans%5Bwght%5D.ttf" || echo "Font download failed, using the system font"
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.9
      - name: Build release APK
        working-directory: ${{ env.DIR }}
        run: gradle assembleRelease --no-daemon --stacktrace
      - name: Rename APK
        run: cp "${{ env.DIR }}/app/build/outputs/apk/release/app-release.apk" myWallet.apk
      - uses: actions/upload-artifact@v4
        with:
          name: myWallet-apk
          path: myWallet.apk
      - name: Publish release (download the APK from your phone)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: myWallet build ${{ github.run_number }}
          files: myWallet.apk
